<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarships | Globepath</title>
<meta name="description" content="Find scholarships by country, degree and field.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/print.css">
<script>try{var t=JSON.parse(localStorage.getItem("globepath:theme"));document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
</head>
<body>
<div id="nav"></div>
<main id="main">
<div class="page-head on-dark"><div class="container"><div class="eyebrow">Scholarship finder</div><h1>Find funding for your degree</h1></div></div>
<div class="container section" style="padding-top:40px"><div class="stack">
  <form class="card filter-bar" id="filter-form">
    <div class="field"><label for="f-country">Country</label><select class="input" id="f-country"></select></div>
    <div class="field"><label for="f-degree">Degree</label><select class="input" id="f-degree"></select></div>
    <div class="field"><label for="f-field">Field</label><select class="input" id="f-field"></select></div>
    <div class="field"><label for="f-q">Search</label><input class="input" id="f-q" type="search" placeholder="Name or keyword"></div>
  </form>
  <p class="muted" id="count" role="status"></p>
  <div class="sch-grid" id="results"></div>
</div></div>
</main>
<div id="footer"></div>
<script type="module" src="assets/js/scholarships.js"></script>
</body></html>
